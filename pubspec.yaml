name: appcheck_admin
description: "Panel de Administración de AppCheck"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  provider: ^6.1.5+1
  universal_html: ^2.3.0
  image_picker: ^1.2.4
  image_picker_for_web: ^3.1.1
  file_saver: ^0.4.0
  fl_chart: ^1.3.1
  pdf: ^3.13.1
  printing: ^5.15.1
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

# Configuración para generar los íconos de la app (Android/iOS)
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/logo.png"  # 👈 Cambiado para que use el mismo logo
  min_sdk_android: 21

