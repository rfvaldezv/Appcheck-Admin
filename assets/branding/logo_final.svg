    <!-- Ojos -->
    <circle cx="80" cy="90" r="10" />
    <circle cx="120" cy="90" r="10" />
    <!-- Sonrisa -->
    <path d="M 80 120 Q 100 140 120 120" stroke="#2563EB" stroke-width="8" stroke-linecap="round" fill="none" />
  </g>
</svg>
