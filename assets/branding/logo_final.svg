<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Marco del QR (Esquinas) -->
  <path d="M 20 20 L 60 20 L 60 40 L 40 40 L 40 60 L 20 60 Z" fill="#0F766E" />
  <path d="M 180 20 L 140 20 L 140 40 L 160 40 L 160 60 L 180 60 Z" fill="#0F766E" />
  <path d="M 20 180 L 60 180 L 60 160 L 40 160 L 40 140 L 20 140 Z" fill="#0F766E" />
  
  <!-- Píxeles flotantes (Tecnología QR) -->
  <rect x="140" y="140" width="15" height="15" fill="#F59E0B" />
  <rect x="160" y="160" width="20" height="20" fill="#0F766E" />
  <rect x="140" y="165" width="10" height="10" fill="#0F766E" />

  <!-- Rostro Central (Facial) -->
